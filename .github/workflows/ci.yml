name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-mods:
    name: Discover mods
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.mods.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build mod matrix
        id: mods
        shell: bash
        run: |
          python -c "import json, pathlib; print(json.dumps(sorted(p.name for p in pathlib.Path('mods').iterdir() if (p / 'info.json').is_file())))" > /tmp/mods.json
          echo "mods=$(cat /tmp/mods.json)" >> "$GITHUB_OUTPUT"

  validate-mod:
    name: Validate ${{ matrix.mod }}
    needs: discover-mods
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.discover-mods.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate mod source
        run: python scripts/validate-mod.py "${{ matrix.mod }}"

  test-suite:
    name: Full source test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Enforce coverage floors (Python and Lua)
        run: python scripts/check-coverage.py
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lua-coverage-report
          path: .coverage-lua.report
          if-no-files-found: warn

  python-quality:
    name: Python lint and static type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install quality dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check scripts tests
      - name: Mypy static type check
        run: mypy --config-file mypy.ini scripts tests

  lua-quality:
    name: Lua lint, static analysis, and type diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download LuaLS
        run: |
          VERSION=3.9.3
          curl -fsSL -o /tmp/luals.tar.gz \
            "https://github.com/LuaLS/lua-language-server/releases/download/${VERSION}/lua-language-server-${VERSION}-linux-x64.tar.gz"
          mkdir -p luals
          tar -xzf /tmp/luals.tar.gz -C luals
      - name: Run Lua diagnostics and type check
        run: python scripts/check-lua-types.py --luals "$PWD/luals/bin/lua-language-server"

  # Packaging is intentionally not part of this Ubuntu workflow.
  # scripts/build.sh requires LSLib/Divine.exe plus extracted BG3 data
  # (.analysis/*), neither of which is checked into this repository.
