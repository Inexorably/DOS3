name: CD

# Runs in parallel with CI on every push to master instead of gating on a
# completed CI run: release latency matters more than a green build gate here,
# and a red CI run must not block packaging.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd-latest
  cancel-in-progress: true

jobs:
  discover-mods:
    name: Discover mods
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.mods.outputs.mods }}
    steps:
      # Read the repository tree through the API so packaging can start without
      # waiting for a checkout or a Python toolchain install.
      - name: Discover mods from the repository tree
        id: mods
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/trees/${GITHUB_SHA}?recursive=1" > /tmp/tree.json
          jq -ce 'if .truncated then error("repository tree was truncated; cannot discover mods") else [.tree[] | select(.type == "blob") | .path | select(startswith("mods/") and endswith("/info.json")) | split("/") | select(length == 3) | .[1]] | unique | sort end' \
            /tmp/tree.json > /tmp/mods.json
          echo "mods=$(cat /tmp/mods.json)" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.mod }}
    needs: discover-mods
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.discover-mods.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # Shared across the matrix so only the first job pays for the download.
      - name: Cache LSLib
        id: lslib-cache
        uses: actions/cache@v4
        with:
          path: tools/lslib
          key: lslib-1.20.4

      - name: Download LSLib
        if: steps.lslib-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools/lslib | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/Norbyte/lslib/releases/download/v1.20.4/ExportTool-v1.20.4.zip" `
            -OutFile "tools/lslib/lslib.zip"
          Expand-Archive -Path "tools/lslib/lslib.zip" -DestinationPath "tools/lslib" -Force

      - name: Build pak
        shell: bash
        env:
          ENR_SKIP_GENERATION: "1"
          CC_SKIP_GENERATION: "1"
        run: ./scripts/build.sh "${{ matrix.mod }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pak-${{ matrix.mod }}
          path: dist/${{ matrix.mod }}.pak
          if-no-files-found: error
          retention-days: 1

  release:
    name: Update latest release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download packaged mods
        uses: actions/download-artifact@v4
        with:
          pattern: pak-*
          path: dist
          merge-multiple: true

      - name: Replace latest release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Keep exactly one release: the latest complete build.
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true

          # Remove any pre-existing versioned releases as well.
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName' || true); do
            if [ "$tag" != "latest" ]; then
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

          gh release create latest \
            --target "$COMMIT_SHA" \
            --title "DOS3 Mods - Latest" \
            --notes "Automated build from commit ${COMMIT_URL} (CD run: ${RUN_URL}). Packaged in parallel with CI; CI status is not a release gate. The mods need the Script Extender build that provides Ext.Entity.GetArmorClass: install it with scripts/install-script-extender.ps1, which downloads the release pinned in vendor/bg3se/pin.json." \
            dist/*.pak
