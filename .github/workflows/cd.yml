name: CD

# vanilla-plus branch release pipeline. GitHub always runs workflow_run
# workflows from the default branch, so this branch triggers on its own push
# and runs the source tests itself before packaging.
on:
  push:
    branches:
      - vanilla-plus
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cd-vanilla-plus
  cancel-in-progress: true

jobs:
  test:
    name: Source tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate mods
        run: python scripts/validate-mod.py --all
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  discover-mods:
    name: Discover mods
    needs: test
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.mods.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build mod matrix
        id: mods
        shell: bash
        run: |
          python -c "import json, pathlib; print(json.dumps(sorted(p.name for p in pathlib.Path('mods').iterdir() if (p / 'info.json').is_file())))" > /tmp/mods.json
          echo "mods=$(cat /tmp/mods.json)" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.mod }}
    needs: discover-mods
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.discover-mods.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download LSLib
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools/lslib | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/Norbyte/lslib/releases/download/v1.20.4/ExportTool-v1.20.4.zip" `
            -OutFile "tools/lslib/lslib.zip"
          Expand-Archive -Path "tools/lslib/lslib.zip" -DestinationPath "tools/lslib" -Force

      - name: Build pak
        shell: bash
        env:
          ENR_SKIP_GENERATION: "1"
          CC_SKIP_GENERATION: "1"
        run: ./scripts/build.sh "${{ matrix.mod }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pak-${{ matrix.mod }}
          path: dist/${{ matrix.mod }}.pak
          if-no-files-found: error

  release:
    name: Update vanilla-plus release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged mods
        uses: actions/download-artifact@v4
        with:
          pattern: pak-*
          path: dist
          merge-multiple: true

      - name: Replace vanilla-plus release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Only ever touch this branch's own release; master keeps "latest".
          gh release delete vanilla-plus-latest --yes --cleanup-tag || true
          git push origin :refs/tags/vanilla-plus-latest || true

          gh release create vanilla-plus-latest             --target "$COMMIT_SHA"             --title "DOS3 Mods - Vanilla Plus"             --notes "Automated vanilla-plus build from commit ${COMMIT_SHA} (run: ${RUN_URL})"             --prerelease             dist/*.pak
